# Monthly country packs: build each country, upload it under an immutable version path, then switch the manifest.
name: Build packs

on:
  schedule:
    - cron: "0 3 2 * *"  # the 2nd: Geofabrik's extracts of the 1st are out
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated country ids (empty = all in countries.yaml)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-packs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.pick.outputs.countries }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: pick
        env:
          WANTED: ${{ inputs.countries }}
        run: |
          uv run --no-project --with pyyaml python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, yaml
          ids = [c["id"] for c in yaml.safe_load(open("countries.yaml"))["countries"]]
          wanted = [w.strip() for w in os.environ.get("WANTED", "").split(",") if w.strip()]
          unknown = set(wanted) - set(ids)
          if unknown:
              raise SystemExit(f"unknown countries: {sorted(unknown)}")
          print("countries=" + json.dumps(wanted or ids))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        country: ${{ fromJson(needs.plan.outputs.countries) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af > /dev/null
          df -h /
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -yq libicu-dev pkg-config
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Download extract
        run: |
          path=$(uv run --no-project --with pyyaml python -c "import yaml; print(next(c['geofabrik'] for c in yaml.safe_load(open('countries.yaml'))['countries'] if c['id'] == '${{ matrix.country }}'))")
          mkdir -p work
          curl -fsSL -o work/extract.osm.pbf "https://download.geofabrik.de/${path}-latest.osm.pbf"
          ls -l work/extract.osm.pbf
      - name: Tables (lanes, landmarks, zones, search)
        run: uv run python -m mapspack tables ${{ matrix.country }} work/extract.osm.pbf work/pack
      - name: Valhalla tiles
        run: scripts/build_valhalla.sh work/extract.osm.pbf work/pack
      - name: Base map
        run: scripts/build_basemap.sh work/extract.osm.pbf work/pack
      - name: Manifest entry
        run: |
          uv run python -m mapspack entry ${{ matrix.country }} work/extract.osm.pbf work/pack > work/entry.json
          python3 -c "import json; e=json.load(open('work/entry.json')); print(e['version'], [(f['name'], f['size']) for f in e['files']])"
      - name: Upload pack
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          prefix=$(python3 -c "import json; e=json.load(open('work/entry.json')); print(f\"packs/{e['id']}/{e['version']}/\")")
          scripts/publish.sh pack work/pack "$prefix"
          df -h /; du -sh work/pack
      - uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.country }}
          path: work/entry.json

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -yq libicu-dev pkg-config && uv sync
      - uses: actions/download-artifact@v4
        with:
          path: entries
          pattern: entry-*
      - name: Switch manifest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p entries
          scripts/publish.sh get-manifest old.json
          uv run python -m mapspack merge old.json entries > manifest.json
          scripts/publish.sh put-manifest manifest.json
          python3 -c "import json; m=json.load(open('manifest.json')); print(sum(f['size'] for p in m['packs'] for f in p['files'])/1e9, 'GB in current packs'); [print(p['id'], p['version']) for p in m['packs']]"
      - name: Delete retired versions
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          scripts/publish.sh list > listing.json
          uv run python -m mapspack retired manifest.json listing.json | while read -r prefix; do
            echo "delete $prefix"; scripts/publish.sh delete "$prefix"
          done
