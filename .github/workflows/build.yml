# Monthly country packs: build each block (a country, or neighbours routed across as one graph), upload it under an immutable version path, then switch the manifest.
name: Build packs

on:
  schedule:
    - cron: "0 3 2 * *"  # the 2nd: Geofabrik's extracts of the 1st are out
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated country ids; a block member builds its whole block (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-packs
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      blocks: ${{ steps.pick.outputs.blocks }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: pick
        env:
          WANTED: ${{ inputs.countries }}
        run: |
          # an unknown id fails here, not as an empty build
          blocks=$(uv run --no-project --with pyyaml python -c 'import json, os; from mapspack.config import plan; print(json.dumps(plan([w.strip() for w in os.environ.get("WANTED", "").split(",") if w.strip()])))')
          echo "blocks=$blocks" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        block: ${{ fromJson(needs.plan.outputs.blocks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af > /dev/null
          df -h /
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -yq libicu-dev pkg-config
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Build the block's packs
        run: scripts/build_block.sh ${{ matrix.block }} work
      - name: Upload packs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for entry in work/*.entry.json; do
            id=$(basename "$entry" .entry.json)
            prefix=$(python3 -c "import json; e=json.load(open('$entry')); print(f\"packs/{e['id']}/{e['version']}/\")")
            scripts/publish.sh pack "work/$id" "$prefix"
          done
          df -h /; du -sh work/*/
      - uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.block }}
          path: work/*.entry.json

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -yq libicu-dev pkg-config && uv sync
      - uses: actions/download-artifact@v4
        with:
          path: entries
          pattern: entry-*
      - name: Switch manifest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p entries
          scripts/publish.sh get-manifest old.json
          uv run python -m mapspack merge old.json entries > manifest.json
          scripts/publish.sh put-manifest manifest.json
          python3 -c "import json; m=json.load(open('manifest.json')); print(sum(f['size'] for p in m['packs'] for f in p['files'])/1e9, 'GB in current packs'); [print(p['id'], p['version']) for p in m['packs']]"
      - name: Delete retired versions
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          scripts/publish.sh list > listing.json
          uv run python -m mapspack retired manifest.json listing.json | while read -r prefix; do
            echo "delete $prefix"; scripts/publish.sh delete "$prefix"
          done
