[project]
name = "almanav-maps"
version = "0.1.0"
description = "Offline country packs for AlmaNav, built from OpenStreetMap"
requires-python = ">=3.12"
dependencies = [
    "osmium>=4.0",
    "pyicu>=2.13",
    "pyyaml>=6.0",
    "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
